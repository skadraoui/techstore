name : Integration Continue by Seif

# sur quel événnement déclencher le pipeline
on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services: # il nous faut un service pour se connecter à la BDD
      postgres: # service postgres database
        image: postgres:15-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: techstore_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

    env:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/techstore_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

# les étapes du pipeline
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B package --file pom.xml



