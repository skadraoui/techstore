<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Les produits</title>
    <link rel="stylesheet" type="text/css"
          href="../static/css/bootstrap.min.css"
          th:href="@{css/bootstrap.min.css}"
    />
</head>
<body>
<h3>Test produits...</h3>
<div class="container">
<table class="table">
    <thead>
    <tr>
        <th>ID</th><th>Désignation</th><th>Prix</th><th>Quantité</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="p:${listProduits}">
        <td th:text="${p.id}"></td>
        <td th:text="${p.designation}"></td>
        <td th:text="${p.prix}"></td>
        <td th:text="${p.quantite}"></td>
        <td><a onclick="return confirm('Etes vous sur de vouloir supprimer ce produit ?')"
        th:href="@{delete(id=${p.id},motCle=${p.designation}, page=${pageCourante}, size=${size})}"></a></td>
    </tr>
    </tbody>
</table>
</div>
<div class="container">
    <ul class="nav nav-pills">
        <li th:class="${pageCourante}==${status.index}?'native':''"
                th:each="pa,status:${pages}">
            <a th:href="@{index(page=${status.index}, size= ${size})}"
               th:text="${status.index}"></a>
        </li>
    </ul>
</div>
</body>
</html>
